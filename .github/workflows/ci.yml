name: ci

# The Node unit suite stays offline and dependency-free. A separate integration
# job pulls the public DSH image so upstream and packaging changes are detected.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Syntax of every shipped file
        run: |
          set -euo pipefail
          for file in src/index.js src/claim.js assets/inpage.js; do
            node --check "${file}"
            printf 'node --check ok: %s\n' "${file}"
          done
          bash -n scripts/test-dsh-image.sh
      - name: The loader entry says insert
        run: |
          set -euo pipefail
          node -e '
            const { readFileSync } = require("node:fs");
            const text = readFileSync("cordis.patch.yml", "utf8");
            if (!/^\s*-\s*insert:/m.test(text)) { console.error("cordis.patch.yml must use insert:"); process.exit(1); }
            if (!/name:\s*dsh-remote-signin\s*$/m.test(text)) { console.error("cordis.patch.yml must name this package"); process.exit(1); }
            console.log("cordis.patch.yml loads dsh-remote-signin through insert:");
          '
      - name: Package manifest is coherent
        run: |
          set -euo pipefail
          node -e '
            const pkg = require("./package.json");
            const { existsSync } = require("node:fs");
            const missing = ["main", "dsh.bundle.patch"].filter((path) =>
              !existsSync(path.split(".").reduce((value, key) => value?.[key], pkg)),
            );
            if (missing.length > 0) { console.error("package.json points at missing files:", missing); process.exit(1); }
            console.log("package.json:", pkg.name, pkg.version);
          '
      - name: Tests
        run: node --test

  dsh-image:
    name: DSH latest image compatibility
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Pull latest DSH image
        run: |
          set -euo pipefail
          docker pull ghcr.io/meixu6693/dsh:latest
          docker image inspect --format 'image={{index .RepoDigests 0}}' ghcr.io/meixu6693/dsh:latest
      - name: Test bundled and checked-out plugins
        run: bash scripts/test-dsh-image.sh ghcr.io/meixu6693/dsh:latest
